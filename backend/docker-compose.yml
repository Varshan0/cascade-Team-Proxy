services:
  postgres:
    # TimescaleDB image is plain Postgres 16 + the extension; we only rely on standard SQL.
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: multipli
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multipli"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/multipli
      REDIS_URL: redis://redis:6379
    command: sh -c "npx tsx src/shared/db/migrate.ts && npx tsx src/api/index.ts"
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/multipli
      REDIS_URL: redis://redis:6379
    command: npx tsx src/worker/index.ts
    depends_on:
      api: { condition: service_started }

volumes:
  pgdata:
